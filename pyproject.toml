[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatturatore"
version = "0.1.0"
description = "CLI minimale per generare fatture elettroniche FatturaPA"
requires-python = ">=3.11"

[project.scripts]
fatturatore = "fatturatore.cli:entrypoint"

[tool.setuptools]
packages = ["fatturatore", "fatturatore.cli"]
